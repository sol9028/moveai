meta:
  version: "8.0"
  concept: "예측 연계형 양방향 E-Train 연속 7일 운행 및 ESS-순환자원 조합 최적화"

planning:
  horizon_days: 7
  require_consecutive_dates: true

data:
  curtailment_csv: "data/forecast/curtailment_forecast.csv"
  demand_csv: "data/forecast/demand_forecast.csv"
  cargo_csv: "data/forecast/cargo_forecast.csv"
  smp_csv: "data/forecast/smp_forecast.csv"
  cargo_types: ["pack_ev", "pack_ess", "blackmass"]

weekly:
  max_cargo_days: 2
  max_operating_days_per_train: 6

consist:
  slots_per_train: 20
  total_trains: 5

ess:
  total_containers: 100
  capacity_mwh: 7.6
  ton_per_mwh: 6.5
  rate_mw: 2.5
  charge_efficiency: 0.95
  discharge_efficiency: 0.95
  depth_of_discharge: 0.8
  initial_soc_ratio: 0.2
  initial_home_containers:
    "장성": 25
    "남원": 25
    "동산": 25
    "새만금": 25
  initial_metro_containers:
    "안중": 0
    "서화성": 0

weight:
  max_car_payload_ton: 50.0
  max_train_payload_ton: 900.0
  cargo_capacity_ton_per_car:
    pack_ev: 30.0
    pack_ess: 30.0
    blackmass: 50.0
  cargo_car_weight_ton:
    pack_ev: 30.0
    pack_ess: 30.0
    blackmass: 50.0

operating_window:
  charge_start_hour: 10
  charge_end_hour: 21
  discharge_start_hour: 10
  discharge_end_hour: 21
  handling_hours_before_return: 1

stations:
  - {id: "장성", type: "charge", substation_capacity_mw: 150.0, cargo_intake_tpd: 300.0}
  - {id: "남원", type: "charge", substation_capacity_mw: 80.0, cargo_intake_tpd: 200.0}
  - {id: "동산", type: "charge", substation_capacity_mw: 80.0, cargo_intake_tpd: 400.0}
  - {id: "새만금", type: "charge", substation_capacity_mw: 100.0, cargo_intake_tpd: 500.0}
  - {id: "안중", type: "discharge", grid_injection_capacity_mw: 150.0}
  - {id: "서화성", type: "discharge", grid_injection_capacity_mw: 150.0}

# cargo_load_nodes에는 해당 하행 경로에서 실제 적재할 수 있는 노드만 넣는다.
transport_arcs:
  - {charge: "장성", discharge: "안중", travel_h: 4, cargo_load_nodes: ["안중", "천안"]}
  - {charge: "장성", discharge: "서화성", travel_h: 4, cargo_load_nodes: ["서화성", "천안"]}
  - {charge: "남원", discharge: "안중", travel_h: 4, cargo_load_nodes: ["안중", "천안"]}
  - {charge: "남원", discharge: "서화성", travel_h: 4, cargo_load_nodes: ["서화성", "천안"]}
  - {charge: "동산", discharge: "안중", travel_h: 3, cargo_load_nodes: ["안중", "신례원"]}
  - {charge: "동산", discharge: "서화성", travel_h: 3, cargo_load_nodes: ["서화성", "신례원"]}
  - {charge: "새만금", discharge: "안중", travel_h: 3, cargo_load_nodes: ["안중", "신례원"]}
  - {charge: "새만금", discharge: "서화성", travel_h: 3, cargo_load_nodes: ["서화성", "신례원"]}

schedule:
  max_round_trips_per_day: 14
  metro_stock_cap_ratio: 0.40
  same_day_return: true

economics:
  charge_price_krw_per_kwh: 11
  battery_degradation_krw_per_mwh: 31000
  charge_discharge_cost_krw_per_mwh: 3500
  train_cost_krw_per_one_way_trip: 3000000
  car_haul_cost_krw_per_car_hour: 20000
  cargo_handling_krw_per_car: 50000
  cargo_holding_krw_per_ton_day: 500
  terminal_cargo_penalty_krw_per_ton: 30000
  cargo_revenue_krw_per_ton:
    pack_ev: 22000
    pack_ess: 22000
    blackmass: 15000

solver:
  time_limit_seconds: 120
  relative_gap: 0.001
  msg: false

