name: test
on: [push, pull_request]
jobs:
  demo-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r main/optimization/requirements.txt
      - run: python main/optimization/generate_demo_forecasts.py --start-date 2026-08-17
      - run: python main/optimization/run.py --start-date 2026-08-17
